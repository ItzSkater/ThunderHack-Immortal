name: Release Build

# Builds the mod jar and attaches it to the release whenever one is
# created or published from the GitHub UI. Also runs on manual dispatch
# so we can attach a jar to an existing release without re-tagging.

on:
  release:
    types: [created, published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload the jar to (e.g. V0.1-beta)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # Skip mod build for launcher / meteor-addon releases — handled by their own workflows.
    if: github.event_name == 'workflow_dispatch' || (!startsWith(github.event.release.tag_name, 'launcher-') && !startsWith(github.event.release.tag_name, 'meteor_addon-'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Build from the branch the dispatch was triggered on so we can
            # ship hotfixes without re-tagging, then upload to the input tag.
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Drop sources/dev jars
        run: |
          rm -f ./build/libs/*-sources.jar
          rm -f ./build/libs/*-dev.jar

      - name: List artifacts
        run: ls -la ./build/libs/

      - name: Attach jar(s) to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: ./build/libs/*.jar
          fail_on_unmatched_files: true
