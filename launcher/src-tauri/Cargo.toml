[package]
name = "thi-launcher"
version = "0.1.0"
description = "ThunderHack-Immortal launcher"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
directories = "5"

# Minecraft launching backend (Fabric loader support).
# Pin to the version you verified; advanced builder methods (memory/jvm args)
# may differ slightly between releases — check `cargo doc -p lighty-launcher`.
lighty-launcher = { version = "26.5.12", features = ["fabric"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
